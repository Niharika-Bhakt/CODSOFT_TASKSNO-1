<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Details - CareerPulse</title>
    <link rel="stylesheet" href="jobs-result.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="results-page-wrapper">
        <div class="results-card">
            <a href="index.html" class="back-link">
                <i class="fa-solid fa-arrow-left"></i> Back to Home
            </a>
            <div class="results-header">
                <h2 id="jobTitleHeading">Job Title</h2>
                <p id="searchSummary" class="search-summary"></p>
            </div>
            
            <!-- Dynamic Job Details Container -->
            <div id="jobDetailsContainer"></div>
        </div>
    </div>

    <!-- Professional Application Modal (Hidden by default) -->
    <div id="jobApplyModal" class="modal-overlay" style="display: none;">
        <div class="modal-content-card">
            <button type="button" id="closeApplyModal" class="modal-close-btn">
                <i class="fa-solid fa-xmark"></i>
            </button>
            
            <div class="modal-header-text">
                <h2 id="modalJobTitle">Apply for this Position</h2>
                <p>Fill in your personal details, upload your CV, and share why you're a great fit.</p>
            </div>

            <form id="jobApplyForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="applicantName" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="applicantEmail" placeholder="name@example.com" required>
                </div>

                <div class="form-group">
                    <label>Upload Resume / CV (.pdf, .doc, .docx)</label>
                    <input type="file" id="applicantCv" accept=".pdf,.doc,.docx" required>
                </div>

                <div class="form-group">
                    <label>Why should we hire you?</label>
                    <textarea id="applicantReason" rows="3" placeholder="Briefly explain your relevant skills, projects, or experience..." required></textarea>
                </div>

                <button type="submit" class="submit-app-btn">Submit Application</button>
            </form>
        </div>
    </div>

    <script src="jobs-result.js"></script>
</body>
</html>
