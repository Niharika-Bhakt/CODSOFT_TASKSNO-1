<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CareerPulse</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-box">
            <a href="index.html" class="back-home"><i class="fa-solid fa-arrow-left"> Back to Home</i></a>
                <h2>Welcome to CareerPulse</h2>
                <p>Enter your details to access your account</p>

            <form id="loginForm">
                <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="loginName" placeholder="Enter your full name" required>
               </div>
                <div class="input-group">
                  <label>Email Address</label>
                 <input type="email" id="loginEmail" placeholder="Enter your email" required>
               </div>
                <div class="input-group">
                   <label>Password</label>
                   <input type="password" id="loginPassword" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="submit-btn">Log In</button>
          </form>
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
